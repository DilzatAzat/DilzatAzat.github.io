---
layout: default
---
<main class="learn-page" data-course="python-for-ai" data-storage-key="{{ site.data.python_course.storage_key }}" data-total-lessons="{{ site.data.python_course.total_lessons }}">
  <header class="learn-page__header">
    {% if page.eyebrow %}<p>{{ page.eyebrow }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="learn-page__dek">{{ page.description }}</p>{% endif %}
  </header>
  <div class="learn-page__content">{{ content }}</div>
</main>
<script defer src="{{ '/assets/js/learning.js' | relative_url }}"></script>
